name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build and test
        shell: pwsh
        run: .\scripts\Build.ps1 -Clean -Test

      - name: Upload candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: raudo-windows
          path: artifacts/Raudo.exe
          if-no-files-found: error
          retention-days: 14
